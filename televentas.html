<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Televentas REFANIC</title>
<meta name="theme-color" content="#0d6b63">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Televentas">
<link rel="apple-touch-icon" href="icono.png">
<link rel="icon" type="image/png" sizes="192x192" href="icono.png">
<link rel="manifest" href="televentas.webmanifest">
<style>
:root{--bg:#eef2f1;--sf:#fff;--sf2:#f5f8f7;--ln:#d6dedc;--ink:#16302d;--mut:#5b6f6c;--ac:#0d6b63;--aci:#fff;--acs:#dcefec;
--ok:#1f8a4c;--oks:#dff3e6;--wa:#a8690a;--was:#fbeed3;--bad:#b93a32;--bads:#fae1de}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f1918;--sf:#182523;--sf2:#1e2e2b;--ln:#2f4440;--ink:#e6efed;--mut:#9db1ad;--ac:#4fc0b3;--aci:#06211e;--acs:#1d3b37;
--ok:#5fcb8a;--oks:#173526;--wa:#e6b257;--was:#3a2e14;--bad:#f08a80;--bads:#3d1f1c}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:76px}
h1,h2,h3{margin:0;line-height:1.2}h1{font-size:21px}h3{font-size:16px;margin-bottom:8px}
button,select,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
main{max-width:520px;margin:0 auto;padding:12px 12px 20px;display:flex;flex-direction:column;gap:10px}
main.ancho{max-width:900px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:13px}
.sub{color:var(--mut);font-size:13px}
.fila{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.bar{height:10px;border-radius:99px;background:var(--sf2);border:1px solid var(--ln);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--ac)}
.kpis{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}.kpis div{display:flex;flex-direction:column}
.kpis b{font-size:21px}.kpis span{font-size:12px;color:var(--mut)}
.slot{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--mut);margin:4px 2px 0;text-transform:uppercase}
.cli{display:flex;flex-direction:column;gap:8px;border-left:5px solid var(--ln)}
.cli.pedido{border-left-color:var(--ok)}.cli.sin{border-left-color:var(--wa)}.cli.no{border-left-color:var(--bad)}
.cli b{font-size:15.5px}
.foco{font-size:12.5px;color:var(--mut)}
.foco em{font-style:normal;background:var(--acs);color:var(--ac);font-weight:600;border-radius:6px;padding:1px 7px;margin:2px 0 0 4px;display:inline-block}
.foco.nc em{background:var(--was);color:var(--wa)}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.acts button{border:1px solid var(--ln);background:var(--sf2);border-radius:9px;padding:10px 4px;font-weight:600;font-size:13px}
.acts button[aria-pressed=true][data-est=pedido]{background:var(--oks);border-color:var(--ok);color:var(--ok)}
.acts button[aria-pressed=true][data-est=sin]{background:var(--was);border-color:var(--wa);color:var(--wa)}
.acts button[aria-pressed=true][data-est=no]{background:var(--bads);border-color:var(--bad);color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.chips>span{font-weight:700;color:var(--mut)}
.chips button{border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:5px 11px;font-size:12.5px}
.chips button[aria-pressed=true]{background:var(--ac);border-color:var(--ac);color:var(--aci);font-weight:600}
input[type=text],input[type=search],input[type=tel],input[type=date],select{background:var(--sf2);border:1px solid var(--ln);border-radius:9px;padding:8px 10px;max-width:100%}
input[type=text],input[type=search]{width:100%}
.pri{background:var(--ac);color:var(--aci);border:0;border-radius:11px;padding:12px 16px;font-weight:700}
.sec{border:1px solid var(--ln);background:var(--sf2);border-radius:9px;padding:7px 12px;font-weight:600}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--oks);color:var(--ok)}.pill.wa{background:var(--was);color:var(--wa)}.pill.bad{background:var(--bads);color:var(--bad)}
.pill.mu{background:var(--sf2);color:var(--mut);border:1px solid var(--ln)}
.msg{border-radius:11px;padding:11px 13px;font-weight:600;font-size:14px;background:var(--was);color:var(--wa)}
.msg.ok{background:var(--oks);color:var(--ok)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;justify-content:center;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;max-width:130px;border:0;background:none;border-radius:10px;padding:9px 4px;font-weight:600;font-size:13px;color:var(--mut)}
nav button[aria-current=page]{background:var(--acs);color:var(--ac)}
.rb{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;padding:8px 0;border-top:1px solid var(--ln)}
.rb:first-child{border-top:0}.rb select{padding:6px 4px;font-size:13px}
.rb .in{color:var(--wa);font-size:12px;font-weight:600}
.guardar{position:sticky;bottom:70px;z-index:2}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th{text-align:left;color:var(--mut);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--ln)}
td{padding:8px;border-bottom:1px solid var(--ln)}
#toast{position:fixed;left:12px;right:12px;bottom:84px;margin:auto;max-width:480px;background:var(--bad);color:#fff;border-radius:11px;padding:11px 14px;font-weight:600;display:none;z-index:9}
.okg{color:var(--ok);font-size:12px;font-weight:700;margin-left:6px}
.promo{background:var(--acs);border-color:transparent}.promo b{color:var(--ac)}
.cargando{text-align:center;color:var(--mut);padding:30px 0}
</style>
</head>
<body>
<main id="main"><div class="cargando">Cargando…</div></main>
<nav id="nav" hidden></nav>
<div id="toast" role="alert"></div>
<script>
var API = 'https://script.google.com/macros/s/AKfycbwSi9NPmVhAW-6dQMskPCnxMXz-NlLAn4DFNhGi1CBAOpztWEmBi60QempZcW4DJlepWg/exec';
var K = '', PIN = '', U = null;
try {
  K = (new URLSearchParams(location.search).get('k') || '').replace(/[^A-Za-z0-9]/g, '');
  if (K) localStorage.setItem('clave', K); else K = localStorage.getItem('clave') || '';
} catch (e) {}
var S = { tab: 'dia', fecha: 0, cli: [], idx: {}, q: '' };
var MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function guardaLocal(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function aFecha(n) { return new Date(Math.floor(n / 10000), Math.floor(n / 100) % 100 - 1, n % 100, 12); }
function aNum(d) { return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
function sumar(n, k) { var d = aFecha(n); d.setDate(d.getDate() + k); return aNum(d); }
function fechaTxt(n) { var d = aFecha(n); return d.getDate() + ' de ' + MESES[d.getMonth()]; }
function mesTxt(n) { return n ? MESES[n % 100 - 1] + ' ' + Math.floor(n / 100) : ''; }
function toast(t) { var e = $('toast'); e.textContent = t; e.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { e.style.display = 'none'; }, 4500); }
function call(a, p) {
  return fetch(API, {
    method: 'POST', credentials: 'omit', redirect: 'follow',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ k: K, pin: PIN, a: a, p: p || {} })
  }).then(function (x) { return x.json(); }, function () {
    throw new Error('Sin conexión. Revisa tu internet e intenta de nuevo.');
  }).then(function (r) {
    if (r && r.ok) return r.d;
    throw new Error(r && r.error ? r.error : 'Sin respuesta del servidor.');
  });
}
function falla(e) { toast(e.message || String(e)); }
function cargando() { $('main').innerHTML = '<div class="cargando">Cargando…</div>'; }

/* ---------- inicio y PIN ---------- */
function inicio() {
  if (!K) { $('main').innerHTML = '<div class="card"><h1>Televentas REFANIC</h1><p>Abre la app desde tu enlace personal. Si no lo tienes, pídelo a tu supervisor.</p></div>'; return; }
  PIN = guardaLocal('pin_' + K) || '';
  if (PIN) entrar(); else pidePin('');
}
function pidePin(err) {
  $('nav').hidden = true;
  $('main').innerHTML = '<div class="card"><h1>Televentas REFANIC</h1><p class="sub">Escribe tu PIN de 4 dígitos.</p>' +
    (err ? '<div class="msg">' + esc(err) + '</div>' : '') +
    '<form id="fpin" style="display:flex;gap:8px;margin-top:10px"><input type="tel" id="pin" inputmode="numeric" maxlength="6" autocomplete="off" aria-label="PIN" style="flex:1;min-width:0;font-size:20px;letter-spacing:.3em">' +
    '<button class="pri" type="submit">Entrar</button></form></div>';
  $('fpin').addEventListener('submit', function (e) { e.preventDefault(); PIN = $('pin').value.trim(); if (PIN) entrar(); });
}
function entrar() {
  cargando();
  call('init').then(function (d) {
    U = d; guardaLocal('pin_' + K, PIN); S.fecha = d.hoy;
    var t = [];
    if (U.opera) t.push(['dia', 'Mi día'], ['buscar', 'Buscar cliente']);
    if (U.vista) t.push(['equipo', 'Equipo']);
    $('nav').innerHTML = t.map(function (x) { return '<button data-tab="' + x[0] + '">' + x[1] + '</button>'; }).join('');
    $('nav').hidden = t.length < 2;
    if (U.opera) cargaDia(); else ir('equipo');
  }).catch(function (e) { PIN = ''; guardaLocal('pin_' + K, ''); pidePin(e.message); });
}
$('nav').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) ir(b.dataset.tab); });
function ir(tab) {
  S.tab = tab;
  [].forEach.call($('nav').children, function (b) { if (b.dataset.tab === tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  $('main').className = tab === 'equipo' ? 'ancho' : '';
  if (tab === 'dia') pintaDia(); else if (tab === 'buscar') pintaBuscar(); else { cargando(); cargaEquipo(); }
}

/* ---------- datos del dia ---------- */
function cargaDia() {
  cargando();
  call('dia').then(function (d) {
    S.cli = d.clientes; S.idx = {}; U.meta = d.meta;
    S.cli.forEach(function (x, i) { S.idx[x.c] = i; x.cola = x.q > 0 || !!x.res; });
    ir(S.tab === 'buscar' ? 'buscar' : 'dia');
  }).catch(falla);
}
function resumen() {
  var r = { ges: 0, efe: 0, ped: 0, of: 0, foco: 0 };
  S.cli.forEach(function (x) { if (x.res) { r.ges++; if (x.res !== 'nc') r.efe++; if (x.res === 'pedido') { r.ped++; if (x.labs) r.foco++; } if (x.of === 'si') r.of++; } });
  return r;
}
function chips(txt) { return txt.split('|').filter(Boolean).map(function (f) { return '<em>' + esc(f) + '</em>'; }).join(''); }
function tarjeta(x) {
  var i = S.idx[x.c];
  var h = '<div class="card cli ' + (x.res === 'nc' ? 'no' : esc(x.res)) + '" id="cli' + i + '"><div><b>' + esc(x.n) + '</b> <span class="sub num">' + esc(x.c) + '</span>' +
    (x.act ? '' : ' <span class="pill wa">Por reactivar</span>') + '<span class="okg" id="okg' + i + '" aria-live="polite"></span></div>';
  h += '<div class="sub">' + esc(x.ej) + (x.m ? ' · ' + esc(x.m) : '') + '</div>';
  h += '<div class="sub">' + (x.uc ? 'Última compra: ' + mesTxt(x.uc) : 'Sin compra en 6 meses') + ' · ' + (x.ult ? 'Último contacto: ' + fechaTxt(x.ult) : 'Sin contacto previo') + '</div>';
  if (x.pend) h += '<div class="foco">En foco, pendiente:' + chips(x.pend) + '</div>';
  if (x.nc) h += '<div class="foco nc">No compra:' + chips(x.nc) + '</div>';
  h += '<div class="chips"><span>Canal</span>' + [['llamada', 'Llamada'], ['whatsapp', 'WhatsApp']].map(function (e) {
    return '<button data-i="' + i + '" data-canal="' + e[0] + '" aria-pressed="' + (x.canal === e[0]) + '">' + e[1] + '</button>'; }).join('') + '</div>';
  h += '<div class="acts">' + [['pedido', 'Con pedido'], ['sin', 'Sin pedido'], ['nc', 'No contestó']].map(function (e) {
    return '<button data-i="' + i + '" data-est="' + (e[0] === 'nc' ? 'no' : e[0]) + '" data-res="' + e[0] + '" aria-pressed="' + (x.res === e[0]) + '">' + e[1] + '</button>'; }).join('') + '</div>';
  h += '<div class="chips"><button data-i="' + i + '" data-of="1" aria-pressed="' + (x.of === 'si') + '">Oferta enviada</button></div>';
  if (x.res === 'pedido') {
    var sel = x.labs ? x.labs.split('|') : [];
    h += '<div class="chips"><span>Labs en foco en el pedido</span>' + (U.labs || []).map(function (l) {
      return '<button data-i="' + i + '" data-lab="' + esc(l) + '" aria-pressed="' + (sel.indexOf(l) >= 0) + '">' + esc(l) + '</button>'; }).join('') + '</div>';
  }
  h += '<input type="text" data-obs="' + i + '" maxlength="300" placeholder="Observación del contacto (opcional)" value="' + esc(x.obs) + '" aria-label="Observación del contacto">';
  return h + '</div>';
}
function cabecera() {
  var r = resumen(), p = U.meta ? Math.min(r.efe / U.meta * 100, 100) : 0;
  if (!$('pbar')) return;
  $('pbar').style.width = p + '%';
  $('kefe').textContent = r.efe + ' / ' + U.meta; $('kges').textContent = r.ges - r.efe;
  $('kped').textContent = r.ped; $('kfoco').textContent = r.foco; $('kof').textContent = r.of;
}
function pintaDia() {
  var h = '<div class="card"><h1>Hola, ' + esc(U.nombre.split(' ')[0]) + '</h1><div class="sub">' + U.dia + ' ' + fechaTxt(U.hoy) + '</div>' +
    '<div class="bar"><i id="pbar"></i></div><div class="kpis num"><div><b id="kefe"></b><span>contactos efectivos</span></div><div><b id="kges"></b><span>no contestó</span></div>' +
    '<div><b id="kped"></b><span>con pedido</span></div><div><b id="kfoco"></b><span>pedidos con foco</span></div><div><b id="kof"></b><span>ofertas</span></div></div></div>';
  U.promos.forEach(function (p) { h += '<div class="card promo"><b>Promoción de hoy: ' + esc(p.t) + '</b><div>' + esc(p.x) + '</div></div>'; });
  var pend = S.cli.filter(function (x) { return x.cola && !x.res; }).sort(function (a, b) { return (a.q || 9999) - (b.q || 9999); });
  var hechos = S.cli.filter(function (x) { return x.res; });
  h += '<div class="slot">Por contactar (' + pend.length + ')</div>';
  if (!pend.length) h += '<div class="card">No quedan clientes en tu lista. Pulsa el botón para traer más.</div>';
  pend.forEach(function (x) { h += tarjeta(x); });
  h += '<button class="sec" id="mas" style="padding:12px">Actualizar mi lista</button>';
  if (hechos.length) { h += '<div class="slot">Contactados hoy (' + hechos.length + ')</div>'; hechos.forEach(function (x) { h += tarjeta(x); }); }
  $('main').innerHTML = h; cabecera();
}
function pintaBuscar() {
  $('main').innerHTML = '<div class="card"><h1>Buscar cliente</h1><div class="sub" style="margin:6px 0 10px">Para registrar un contacto con cualquier cliente de tu cartera, por ejemplo cuando él te escribe.</div>' +
    '<input type="search" id="buscar" placeholder="Nombre o código" value="' + esc(S.q) + '" aria-label="Buscar cliente"></div><div id="res" style="display:flex;flex-direction:column;gap:10px"></div>';
  listaBuscar();
}
function listaBuscar() {
  var q = S.q.trim().toLowerCase(), h = '', n = 0;
  if (q.length < 2) { $('res').innerHTML = '<div class="sub">Escribe al menos dos letras.</div>'; return; }
  S.cli.forEach(function (x) { if (n < 25 && (x.n.toLowerCase().indexOf(q) >= 0 || x.c.indexOf(q) >= 0)) { h += tarjeta(x); n++; } });
  $('res').innerHTML = h || '<div class="sub">No hay clientes con ese nombre en tu cartera.</div>';
}
function guarda(i) {
  var x = S.cli[i];
  call('contacto', { cliente: x.c, canal: x.canal, res: x.res, of: x.of, obs: x.obs, labs: x.res === 'pedido' ? (x.labs || '') : '' }).then(function () {
    var g = $('okg' + i); if (!g) return;
    g.textContent = 'Guardado ✓';
    clearTimeout(guarda['t' + i]);
    guarda['t' + i] = setTimeout(function () { var q = $('okg' + i); if (q) q.textContent = ''; }, 2500);
  }).catch(function (e) { falla(e); cargaDia(); });
}
$('main').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b) return;
  if (b.id === 'mas') { cargaDia(); return; }
  if (b.dataset.mov) { S.fecha = sumar(S.fecha, Number(b.dataset.mov)); cargaEquipo(); return; }
  if (b.dataset.i === undefined) return;
  var i = Number(b.dataset.i), x = S.cli[i];
  if (b.dataset.canal) x.canal = b.dataset.canal;
  else if (b.dataset.res) { x.res = x.res === b.dataset.res ? '' : b.dataset.res; if (x.res && !x.canal) x.canal = 'llamada'; x.cola = true; }
  else if (b.dataset.of) x.of = x.of === 'si' ? '' : 'si';
  else if (b.dataset.lab) { var ls = x.labs ? x.labs.split('|') : [], p = ls.indexOf(b.dataset.lab); if (p >= 0) ls.splice(p, 1); else ls.push(b.dataset.lab); x.labs = ls.join('|'); }
  else return;
  $('cli' + i).outerHTML = tarjeta(x);
  cabecera(); guarda(i);
});
$('main').addEventListener('change', function (e) {
  var t = e.target;
  if (t.dataset.obs !== undefined) { var i = Number(t.dataset.obs); S.cli[i].obs = t.value; guarda(i); }
});
$('main').addEventListener('input', function (e) { if (e.target.id === 'buscar') { S.q = e.target.value; listaBuscar(); } });

/* ---------- Equipo ---------- */
function cargaEquipo() {
  call('equipo', { fecha: S.fecha }).then(function (d) {
    var t = { ges: 0, efe: 0, ped: 0, of: 0, foco: 0, meta: 0 };
    d.filas.forEach(function (f) { t.ges += f.ges; t.efe += f.efe; t.ped += f.ped; t.of += f.of; t.foco += f.foco; t.meta += f.meta; });
    var h = '<div class="card"><h1>Equipo de televentas</h1><div class="fila" style="margin-top:8px"><button class="sec" data-mov="-1" aria-label="Día anterior">‹</button>' +
      '<b>' + d.dia + ' ' + fechaTxt(d.fecha) + (d.fecha === d.hoy ? ' (hoy)' : '') + '</b><button class="sec" data-mov="1" aria-label="Día siguiente">›</button></div>' +
      '<div class="kpis num"><div><b>' + t.efe + ' / ' + t.meta + '</b><span>contactos efectivos</span></div><div><b>' + (t.ges - t.efe) + '</b><span>no contestó</span></div>' +
      '<div><b>' + t.ped + '</b><span>con pedido</span></div><div><b>' + t.foco + '</b><span>pedidos con foco</span></div><div><b>' + t.of + '</b><span>ofertas</span></div></div></div>';
    if (d.labs && d.labs.length) h += '<div class="card"><h3>Pedidos por laboratorio en foco</h3><div class="kpis num">' + d.labs.map(function (l) { return '<div><b>' + l.n + '</b><span>' + esc(l.lab) + '</span></div>'; }).join('') + '</div></div>';
    h += '<div class="card"><div class="tbl"><table><thead><tr><th>Televentas</th><th>Efectivos</th><th>No contestó</th><th>Con pedido</th><th>Con foco</th><th>Ofertas</th><th>Estado</th></tr></thead><tbody>';
    d.filas.forEach(function (f) {
      var p = f.meta ? Math.round(f.efe / f.meta * 100) : 0, k = !f.ges ? 'bad' : p >= 100 ? 'ok' : 'wa', tx = !f.ges ? 'Sin registros' : p >= 100 ? 'Meta cumplida' : p + '% de la meta';
      h += '<tr><td><b>' + esc(f.nombre) + '</b><div class="sub num">' + f.activos + ' activos de ' + f.cartera + '</div></td><td class="num">' + f.efe + ' / ' + f.meta + '</td><td class="num">' + (f.ges - f.efe) + '</td><td class="num">' + f.ped + '</td><td class="num">' + f.foco + '</td><td class="num">' + f.of + '</td><td><span class="pill ' + k + '">' + tx + '</span></td></tr>';
    });
    $('main').innerHTML = h + '</tbody></table></div></div>';
  }).catch(falla);
}
inicio();
</script>
</body>
</html>
